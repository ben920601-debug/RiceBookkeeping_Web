    <script>document.write('<script src="shared.js?v=' + Date.now() + '"></' + 'script>');</script>
    <script>
        window.addEventListener('DOMContentLoaded', async () => {
            const session = await bootstrapSubPage('trips');
            if (!session) return;
            loadTripsDashboard();
        });

        async function loadTripsDashboard() {
            const session = getSession();
            document.getElementById("trip-loading-text").classList.remove("hidden");
            try {
                const ownerType = session.isGroup ? "group" : "user";
                const trips = await apiFetch(`/api/trips?owner_type=${ownerType}&owner_id=${encodeURIComponent(session.targetId)}`);

                let html = "";
                trips.forEach((t) => {
                    const dep = new Date(t.departure_at);
                    const ret = new Date(t.return_at);
                    const depStr = `${dep.getMonth() + 1}/${dep.getDate()} ${String(dep.getHours()).padStart(2, '0')}:${String(dep.getMinutes()).padStart(2, '0')}`;
                    const retStr = `${ret.getMonth() + 1}/${ret.getDate()} ${String(ret.getHours()).padStart(2, '0')}:${String(ret.getMinutes()).padStart(2, '0')}`;
                    const isConfirmed = t.status === 'confirmed';
                    const statusBadge = isConfirmed
                        ? `<span class="text-[9px] bg-emerald-500/10 text-emerald-400 px-2 py-0.5 rounded-full font-bold">已完成規劃</span>`
                        : `<span class="text-[9px] bg-amber-500/10 text-amber-400 px-2 py-0.5 rounded-full font-bold">規劃中</span>`;
                    const codeBadge = t.trip_code ? `<span class="text-xs font-mono text-white/60 ml-2">#${t.trip_code}</span>` : "";

                    let itemsHtml = "";
                    (t.items || []).forEach((it) => {
                        const d = new Date(it.scheduled_at);
                        const dStr = `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
                        const dtInputVal = it.scheduled_at.slice(0, 16);
                        itemsHtml += `
                            <div class="flex justify-between items-center bg-[#0A1128]/50 p-2 rounded-xl text-xs font-mono">
                                <span class="text-white/70">${dStr}</span>
                                <span class="text-white/90 flex-1 px-2 truncate">${it.location_name}</span>
                                <div class="flex items-center gap-1">
                                    <button onclick="window.editTripItem(${it.id}, '${dtInputVal}', '${it.location_name.replace(/'/g, "\\'")}')" class="text-white/30 hover:text-white cursor-pointer">✎</button>
                                    <button onclick="window.deleteTripItem(${it.id})" class="text-rose-400/30 hover:text-rose-400 cursor-pointer">🗑️</button>
                                </div>
                            </div>`;
                    });
                    if (!itemsHtml) {
                        itemsHtml = `<div class="text-center py-3 text-white/20 text-[10px] font-mono">😴 尚未登記任何地點</div>`;
                    }

                    const aiNote = t.ai_route_summary
                        ? `<div class="bg-[#0A1128]/50 rounded-xl p-3 border border-white/5 text-[11px] text-white/60"><span class="text-white/30 text-[9px] uppercase tracking-wider block mb-1">🤖 米粒建議</span>${t.ai_route_summary}</div>`
                        : "";

                    html += `
                        <div class="bg-[#1C2541] border border-white/5 rounded-2xl p-4 space-y-3 shadow-lg">
                            <div class="flex justify-between items-start border-b border-white/5 pb-2.5 font-mono">
                                <div>
                                    ${statusBadge}${codeBadge}
                                    <div class="text-xs font-bold mt-1 text-white/80">📅 ${depStr} → ${retStr}</div>
                                </div>
                                <div class="flex items-center gap-2">
                                    <button onclick="window.editTripTimes(${t.id}, '${t.departure_at.slice(0, 16)}', '${t.return_at.slice(0, 16)}')" class="text-[10px] text-white/40 hover:text-white cursor-pointer">✎ 時間</button>
                                    <button onclick="window.deleteTrip(${t.id})" class="text-[10px] text-rose-400/40 hover:text-rose-400 cursor-pointer">🗑️ 刪除</button>
                                </div>
                            </div>
                            <div class="space-y-1.5">
                                <div class="flex justify-between items-center">
                                    <div class="text-[10px] text-white/30 tracking-wider uppercase font-bold font-mono">📍 行程地點：</div>
                                    <button onclick="window.addTripItem(${t.id})" class="text-[10px] text-emerald-400/70 hover:text-emerald-400 cursor-pointer">＋ 新增地點</button>
                                </div>
                                ${itemsHtml}
                            </div>
                            ${aiNote}
                        </div>`;
                });

                document.getElementById("trip-loading-text").classList.add("hidden");
                document.getElementById("trip-list").innerHTML = html ? html : catEmptyState("目前尚無任何旅行規劃<br>可用上方表單新增，或於 LINE 對話輸入「旅行模式」開始規劃", "py-6");
            } catch (e) {
                console.error(e);
                document.getElementById("trip-loading-text").classList.add("hidden");
                document.getElementById("trip-list").innerHTML = `<div class="text-center py-6 text-rose-400/50 text-xs font-mono">讀取失敗：${e.message}</div>`;
            }
        }

        // datetime-local 的值是 "YYYY-MM-DDTHH:MM"，後端需要 "YYYY-MM-DD HH:MM"
        function toBackendDateTime(localValue) {
            return localValue.replace("T", " ");
        }

        window.createTrip = async function() {
            const session = getSession();
            const depVal = document.getElementById("trip-new-departure").value;
            const retVal = document.getElementById("trip-new-return").value;
            if (!depVal || !retVal) { alert("請填寫出發與回程時間"); return; }
            try {
                await apiFetch(`/api/trips`, {
                    method: "POST",
                    body: JSON.stringify({
                        owner_type: session.isGroup ? "group" : "user",
                        owner_id: session.targetId,
                        departure_at: toBackendDateTime(depVal),
                        return_at: toBackendDateTime(retVal)
                    })
                });
                document.getElementById("trip-new-departure").value = "";
                document.getElementById("trip-new-return").value = "";
                loadTripsDashboard();
            } catch (e) { alert("建立失敗：" + e.message); }
        }

        window.editTripTimes = async function(tripId, currentDep, currentRet) {
            const newDep = prompt("出發時間 (YYYY-MM-DDTHH:MM)：", currentDep); if (!newDep) return;
            const newRet = prompt("回程時間 (YYYY-MM-DDTHH:MM)：", currentRet); if (!newRet) return;
            try {
                await apiFetch(`/api/trips/${tripId}`, {
                    method: "PATCH",
                    body: JSON.stringify({ departure_at: toBackendDateTime(newDep), return_at: toBackendDateTime(newRet) })
                });
                loadTripsDashboard();
            } catch (e) { alert("修改失敗：" + e.message); }
        }

        window.deleteTrip = async function(tripId) {
            if (confirm("⚠️ 確定要刪除這趟旅行規劃嗎？底下所有行程地點也會一併刪除。")) {
                try {
                    await apiFetch(`/api/trips/${tripId}`, { method: "DELETE" });
                    loadTripsDashboard();
                } catch (e) { alert("刪除失敗：" + e.message); }
            }
        }

        window.addTripItem = async function(tripId) {
            const dt = prompt("到達時間 (YYYY-MM-DDTHH:MM)：", ""); if (!dt) return;
            const loc = prompt("地點名稱：", ""); if (!loc) return;
            try {
                await apiFetch(`/api/trips/${tripId}/items`, {
                    method: "POST",
                    body: JSON.stringify({ scheduled_at: toBackendDateTime(dt), location_name: loc.trim() })
                });
                loadTripsDashboard();
            } catch (e) { alert("新增失敗：" + e.message); }
        }

        window.editTripItem = async function(itemId, currentDt, currentLoc) {
            const newDt = prompt("到達時間 (YYYY-MM-DDTHH:MM)：", currentDt); if (!newDt) return;
            const newLoc = prompt("地點名稱：", currentLoc); if (!newLoc) return;
            try {
                await apiFetch(`/api/itinerary-items/${itemId}`, {
                    method: "PATCH",
                    body: JSON.stringify({ scheduled_at: toBackendDateTime(newDt), location_name: newLoc.trim() })
                });
                loadTripsDashboard();
            } catch (e) { alert("修改失敗：" + e.message); }
        }

        window.deleteTripItem = async function(itemId) {
            if (confirm("⚠️ 確定要刪除這個行程地點嗎？")) {
                try {
                    await apiFetch(`/api/itinerary-items/${itemId}`, { method: "DELETE" });
                    loadTripsDashboard();
                } catch (e) { alert("刪除失敗：" + e.message); }
            }
        }

        // ==========================================
        // 💰 PAGE 5: 理財工具（繳費／存錢／支付方式，個人版限定）
        // ==========================================
    </script>
