    <script>document.write('<script src="shared.js?v=' + Date.now() + '"></' + 'script>');</script>
    <script>
        window.addEventListener('DOMContentLoaded', async () => {
            const session = await bootstrapSubPage('orders');
            if (!session) return;
            if (!session.isGroup) { window.location.href = 'index.html'; return; }
            loadOrdersDashboard();
        });

        async function loadOrdersDashboard() {
            const session = getSession();
            await loadGroupMembersCache(session.targetId);

            document.getElementById("order-loading-text").classList.remove("hidden");
            try {
                const orders = await apiFetch(`/api/groups/${encodeURIComponent(session.targetId)}/orders`);

                let masterHtml = "";
                orders.forEach((o) => {
                    const orderId = o.id; const code = o.order_code; const orderName = o.order_name;
                    const date = o.order_date; const total = o.total_amount || 0;
                    const items = o.items || [];
                    const expected = o.expected || {};
                    const actual = o.actual || {};

                    let subRowsHtml = "";
                    Object.keys(expected).forEach(person => {
                        const targetAmt = expected[person]; const paidAmt = actual[person] || 0;
                        if (paidAmt >= targetAmt) {
                            subRowsHtml += `<div class="flex justify-between py-1 text-emerald-400"><span>🟢 ${escapeHtml(person)} (已付清)</span><span class="font-mono">$${targetAmt}</span></div>`;
                        } else if (paidAmt > 0) {
                            subRowsHtml += `<div class="flex justify-between py-1 text-amber-400"><span>🟡 ${escapeHtml(person)} (已付 $${paidAmt}，欠 ${targetAmt - paidAmt})</span><span class="font-mono">$${targetAmt}</span></div>`;
                        } else {
                            subRowsHtml += `<div class="flex justify-between py-1 text-rose-400"><span>🔴 ${escapeHtml(person)} (未付款)</span><span class="font-mono">$${targetAmt}</span></div>`;
                        }
                    });
                    if (!subRowsHtml) subRowsHtml = `<div class="text-white/20 text-center py-2">尚無分攤品項</div>`;

                    let rawItemsHtml = "";
                    items.forEach((item) => {
                        rawItemsHtml += `
                            <div class="flex justify-between items-center bg-[#0A1128]/50 p-2 rounded-xl text-xs font-mono">
                                <span class="text-white/60"><span class="text-white font-bold">${escapeHtml(item.buyer_name)}</span>: ${escapeHtml(item.item_name)}</span>
                                <div class="flex items-center gap-2">
                                    <span class="font-mono font-bold text-white/80">$${item.price}</span>
                                    <button onclick="window.editOrderItem(${item.id}, '${item.buyer_id || ''}', '${escapeHtml(item.buyer_name).replace(/'/g, "\\'")}', '${escapeHtml(item.item_name).replace(/'/g, "\\'")}', ${item.price})" class="text-white/30 hover:text-white cursor-pointer">✎</button>
                                    <button onclick="window.deleteOrderItem(${item.id})" class="text-rose-400/30 hover:text-rose-400 cursor-pointer">🗑️</button>
                                </div>
                            </div>`;
                    });

                    masterHtml += `
                        <div class="bg-[#1C2541] border border-white/5 rounded-2xl p-4 space-y-3 shadow-lg">
                            <div class="flex justify-between items-start border-b border-white/5 pb-2.5 font-mono">
                                <div>
                                    <span class="text-xs bg-emerald-500/10 text-emerald-400 px-2 py-0.5 rounded-full font-bold">#${code}</span>
                                    <span class="text-xs text-white/40 ml-2">${date}</span>
                                    ${orderName ? `<div class="text-xs font-bold mt-1 text-white/90">📋 ${escapeHtml(orderName)}</div>` : ""}
                                    <div class="text-xs font-bold mt-1 text-white/80 flex items-center gap-1.5">
                                        💳 墊款人：${escapeHtml(o.master_payer_name || '群組成員')}
                                        <button onclick="window.editOrderMasterPayer(${orderId}, '${o.master_payer_id || ''}', '${escapeHtml(o.master_payer_name || '').replace(/'/g, "\\'")}')" class="text-white/30 hover:text-white cursor-pointer text-[10px]">✎</button>
                                    </div>
                                </div>
                            <div class="text-right">
                                <span class="text-sm font-black text-white">$${total.toLocaleString()}</span>
                                <button onclick="window.deleteOrderMaster(${orderId}, '${code}')" class="block text-[10px] text-rose-400/40 hover:text-rose-400 mt-1 ml-auto cursor-pointer">🗑️ 刪除整單</button>
                            </div>
                            </div>
                            <div class="space-y-1.5">
                                <div class="flex justify-between items-center">
                                    <div class="text-[10px] text-white/30 tracking-wider uppercase font-bold font-mono">🛒 點單品項調整：</div>
                                    <button onclick="window.addOrderItem(${orderId})" class="text-[10px] text-emerald-400/70 hover:text-emerald-400 cursor-pointer">＋ 新增付款人</button>
                                </div>
                                ${rawItemsHtml}
                            </div>
                            <div class="bg-[#0A1128]/50 rounded-xl p-3 border border-white/5 text-xs space-y-1 font-mono">
                                <div class="text-[10px] text-white/30 tracking-wider uppercase font-bold pb-1">📊 成員收欠款實時對帳：</div>
                                ${subRowsHtml}
                            </div>
                        </div>`;
                });

                document.getElementById("order-loading-text").classList.add("hidden");
                document.getElementById("order-master-list").innerHTML = masterHtml ? masterHtml : catEmptyState("本群組尚無任何揪團訂單", "py-6");
            } catch (e) { console.error(e); document.getElementById("order-loading-text").classList.add("hidden"); }
        }

        window.editOrderItem = async function(itemId, currentBuyerId, currentBuyerName, currentItem, currentPrice) {
            const member = await pickGroupMember(`「${currentItem}」的付款人是誰？`);
            let buyerId = currentBuyerId, buyerName = currentBuyerName;
            if (member) { buyerId = member.user_id; buyerName = member.display_name; }

            const newItem = prompt("請修改品項名稱:", currentItem); if (!newItem) return;
            const newPriceStr = prompt("請修改品項金額:", currentPrice); if (!newPriceStr) return;
            const newPrice = parseInt(newPriceStr, 10); if (isNaN(newPrice) || newPrice <= 0) return;
            try {
                await apiFetch(`/api/order-items/${itemId}`, {
                    method: "PATCH",
                    body: JSON.stringify({ buyer_id: buyerId, buyer_name: buyerName.trim(), item_name: newItem.trim(), price: newPrice })
                });
                loadOrdersDashboard();
            } catch (e) { alert("微調失敗：" + e.message); }
        }

        window.addOrderItem = async function(orderId) {
            const session = getSession();
            const member = await pickGroupMember("這筆要新增分攤給誰？");
            if (!member) return;
            const itemName = prompt("品項名稱：", ""); if (!itemName) return;
            const priceStr = prompt("金額：", ""); if (!priceStr) return;
            const price = parseInt(priceStr, 10); if (isNaN(price) || price <= 0) return alert("金額格式錯誤");
            try {
                await apiFetch(`/api/groups/${encodeURIComponent(session.targetId)}/orders/${orderId}/items`, {
                    method: "POST",
                    body: JSON.stringify({ buyer_id: member.user_id, buyer_name: member.display_name, item_name: itemName.trim(), price })
                });
                loadOrdersDashboard();
            } catch (e) { alert("新增失敗：" + e.message); }
        }

        window.editOrderMasterPayer = async function(orderId, currentPayerId, currentPayerName) {
            const session = getSession();
            const member = await pickGroupMember("這筆團單是誰先墊付的？");
            if (!member) return;
            try {
                await apiFetch(`/api/groups/${encodeURIComponent(session.targetId)}/orders/${orderId}`, {
                    method: "PATCH",
                    body: JSON.stringify({ master_payer_id: member.user_id, master_payer_name: member.display_name })
                });
                loadOrdersDashboard();
            } catch (e) { alert("修改墊付人失敗：" + e.message); }
        }

        window.deleteOrderItem = async function(itemId) {
            if (confirm("⚠️ 確定要刪除這個品項嗎？")) {
                try {
                    await apiFetch(`/api/order-items/${itemId}`, { method: "DELETE" });
                    loadOrdersDashboard();
                } catch (e) { alert("刪除失敗：" + e.message); }
            }
        }

        window.deleteOrderMaster = async function(orderId, code) {
            const session = getSession();
            if (confirm(`⚠️ 確定要刪除整張團單 #${code} 嗎？此動作無法復原。`)) {
                try {
                    await apiFetch(`/api/groups/${encodeURIComponent(session.targetId)}/orders/${orderId}`, { method: "DELETE" });
                    loadOrdersDashboard();
                } catch (e) { alert("刪除失敗：" + e.message); }
            }
        }
    </script>
</body>
