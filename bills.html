        (function () {
            if (!location.search.includes('v=')) {
                var sep = location.search ? '&' : '?';
                location.replace(location.pathname + location.search + sep + 'v=' + Date.now());
            }
        })();

                <p id="maintenance-password-error" class="text-[10px] text-rose-400 hidden">❌ 密碼錯誤</p>
            </div>

    <header class="bg-[#000411]/40 backdrop-blur-md text-white/90 py-4 px-6 border-b border-white/5 sticky top-0 z-30 flex items-center justify-between">

            <span id="user-avatar" class="w-6 h-6 rounded-full bg-white/10 bg-cover bg-center"></span>
            <span id="user-name" class="text-xs font-bold tracking-wider">載入中...</span>
            <span id="mode-badge" class="text-[9px] bg-white/10 text-white/70 px-2 py-0.5 rounded-full font-medium tracking-wider">個人模式</span>

        <span class="text-[9px] text-white/30 tracking-widest uppercase font-semibold flex items-center gap-1.5">
            RiceBookKeeping

    <div class="flex-1 w-full mx-auto">
        <main id="page-bills" class="max-w-md mx-auto px-6 py-6 space-y-6">
            <!-- 💳 繳費管理 -->
            <section class="bg-[#1C2541] rounded-2xl p-5 shadow-xl border border-white/5 space-y-3">
                <h3 class="text-[11px] font-bold text-white/50 tracking-widest uppercase">💳 新增繳費項目</h3>
                <p class="text-[10px] text-white/40">到期日前 2 天會主動提醒您；LINE 對話中輸入「帳單名稱 金額」即可核銷。</p>
                <div class="grid grid-cols-2 gap-3">
                    <input type="text" id="bill-new-name" placeholder="帳單名稱" class="bg-[#0A1128] border border-white/10 rounded-xl px-3 py-2 text-xs text-white focus:outline-none">
                    <input type="number" id="bill-new-amount" placeholder="金額" class="bg-[#0A1128] border border-white/10 rounded-xl px-3 py-2 text-xs text-white focus:outline-none">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-[10px] text-white/40 block tracking-wider uppercase mb-1">到期日</label>
                        <input type="date" id="bill-new-due" class="w-full bg-[#0A1128] border border-white/10 rounded-xl px-3 py-2 text-xs text-white focus:outline-none">
                    </div>
                    <div>
                        <label class="text-[10px] text-white/40 block tracking-wider uppercase mb-1">分期期數（選填）</label>
                        <input type="number" id="bill-new-installments" placeholder="不填=每月持續" class="w-full bg-[#0A1128] border border-white/10 rounded-xl px-3 py-2 text-xs text-white focus:outline-none">
                    </div>
                </div>
                <button onclick="window.createBill()" class="w-full bg-white text-[#0A1128] font-bold text-xs tracking-widest py-3 rounded-xl hover:bg-white/90 transition shadow-md cursor-pointer uppercase">
                    💳 建立繳費項目
                </button>
            </section>

            <section class="bg-[#1C2541] rounded-2xl p-6 shadow-xl border border-white/5">
                <h3 class="text-[11px] font-bold text-white/50 tracking-widest uppercase mb-4">💳 繳費項目清單</h3>
                <div id="bill-loading-text" class="text-center py-6 text-white/30 text-xs">正在檢索繳費項目...</div>
                <div id="bill-list" class="space-y-3"></div>
            </section>

        </main>
    </div>

                    <span class="nav-label text-[10px] font-medium tracking-wider whitespace-nowrap">監控首頁</span>
                </a>
                <a href="manage.html" id="btn-nav-manage" class="w-16 flex-shrink-0 flex flex-col items-center justify-center gap-1 transition text-white/40">
                    <span class="w-5 h-5 inline-flex items-center justify-center"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg></span>
                    <span class="nav-label text-[10px] font-medium tracking-wider whitespace-nowrap">明細查詢</span>
                </a>
                <a href="orders.html" id="btn-nav-orders" class="w-16 flex-shrink-0 flex flex-col items-center justify-center gap-1 transition text-white/40 hidden">
                    <span class="relative inline-block">
                        <span class="w-5 h-5 inline-flex items-center justify-center"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"></path><rect x="9" y="3" width="6" height="4" rx="1"></rect><path d="M9 14l2 2 4-4"></path></svg></span>
                        <span class="badge-anchor absolute -top-1 -right-2"></span>

                    <span class="nav-label text-[10px] font-medium tracking-wider whitespace-nowrap">團單核銷</span>
                </a>
                <a href="trips.html" id="btn-nav-trips" class="w-16 flex-shrink-0 flex flex-col items-center justify-center gap-1 transition text-white/40">
                    <span class="relative inline-block">
                        <span class="w-5 h-5 inline-flex items-center justify-center"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><rect x="2" y="7" width="20" height="14" rx="2"></rect><path d="M16 21V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v16"></path></svg></span>

                    </span>

                </a>

    <script>document.write('<script src="shared.js?v=' + Date.now() + '"></' + 'script>');</script>
    <script>
        window.addEventListener('DOMContentLoaded', async () => {
            const session = await bootstrapSubPage('bills');
            if (!session) return;
            if (session.isGroup) { window.location.href = 'index.html'; return; }
            loadBillsList();
        });

        async function loadBillsList() {
            const session = getSession();
            const loadingEl = document.getElementById("bill-loading-text");
            loadingEl.classList.remove("hidden");
            try {
                const bills = await apiFetch(`/api/bills?owner_id=${encodeURIComponent(session.targetId)}`);
                loadingEl.classList.add("hidden");
                if (!bills.length) {
                    document.getElementById("bill-list").innerHTML = catEmptyState("目前沒有登記中的繳費項目", "py-6");
                    return;
                }
                document.getElementById("bill-list").innerHTML = bills.map(b => {
                    const statusBadge = b.status === 'completed'
                        ? `<span class="text-[9px] bg-white/10 text-white/50 px-2 py-0.5 rounded-full font-bold">已完成</span>`
                        : (b.is_paid
                            ? `<span class="text-[9px] bg-emerald-500/10 text-emerald-400 px-2 py-0.5 rounded-full font-bold">✅ 已繳</span>`
                            : `<span class="text-[9px] bg-rose-500/10 text-rose-400 px-2 py-0.5 rounded-full font-bold">🔴 未繳</span>`);
                    const period = b.installments_remaining !== null ? `（剩 ${b.installments_remaining} 期）` : "";
                    return `
                        <div class="bg-[#0A1128]/50 p-3 rounded-xl text-xs font-mono space-y-1.5">
                            <div class="flex justify-between items-center">
                                <span class="font-bold text-white/90">${escapeHtml(b.bill_name)}</span>
                                ${statusBadge}
                            </div>
                            <div class="flex justify-between items-center text-white/60">
                                <span>💰 $${b.amount.toLocaleString()} ｜ 📅 ${b.due_date}${period}</span>
                                <div class="flex items-center gap-2">
                                    <button onclick="window.editBill(${b.id}, '${escapeHtml(b.bill_name)}', ${b.amount}, '${b.due_date}', ${b.installments_remaining === null ? 'null' : b.installments_remaining})" class="text-white/30 hover:text-white cursor-pointer">✎</button>
                                    <button onclick="window.deleteBill(${b.id})" class="text-rose-400/30 hover:text-rose-400 cursor-pointer">🗑️</button>
                                </div>
                            </div>
                        </div>`;
                }).join("");
            } catch (e) {
                loadingEl.classList.add("hidden");
                document.getElementById("bill-list").innerHTML = `<div class="text-center py-6 text-rose-400/50 text-xs font-mono">讀取失敗：${e.message}</div>`;
            }
        }

        window.createBill = async function() {
            const session = getSession();
            const name = document.getElementById("bill-new-name").value.trim();
            const amount = parseInt(document.getElementById("bill-new-amount").value, 10);
            const due = document.getElementById("bill-new-due").value;
            const instVal = document.getElementById("bill-new-installments").value;
            if (!name || !amount || !due) return alert("請填寫帳單名稱、金額、到期日");
            try {
                await apiFetch(`/api/bills?owner_id=${encodeURIComponent(session.targetId)}`, {
                    method: "POST",
                    body: JSON.stringify({ bill_name: name, amount, due_date: due, installments_remaining: instVal ? parseInt(instVal, 10) : null })
                });
                document.getElementById("bill-new-name").value = "";
                document.getElementById("bill-new-amount").value = "";
                document.getElementById("bill-new-due").value = "";
                document.getElementById("bill-new-installments").value = "";
                loadBillsList();
            } catch (e) { alert("建立失敗：" + e.message); }
        }

        window.editBill = async function(id, currentName, currentAmount, currentDue, currentInst) {
            const name = prompt("帳單名稱：", currentName); if (!name) return;
            const amountStr = prompt("金額：", currentAmount); if (!amountStr) return;
            const due = prompt("到期日 (YYYY-MM-DD)：", currentDue); if (!due) return;
            const instStr = prompt("分期剩餘期數（不填=每月持續無限期）：", currentInst === null ? "" : currentInst);
            try {
                await apiFetch(`/api/bills/${id}`, {
                    method: "PATCH",
                    body: JSON.stringify({
                        bill_name: name.trim(), amount: parseInt(amountStr, 10), due_date: due,
                        installments_remaining: instStr ? parseInt(instStr, 10) : null
                    })
                });
                loadBillsList();
            } catch (e) { alert("修改失敗：" + e.message); }
        }

        window.deleteBill = async function(id) {
            if (confirm("⚠️ 確定要刪除這個繳費項目嗎？相關核銷紀錄也會一併刪除。")) {
                try {
                    await apiFetch(`/api/bills/${id}`, { method: "DELETE" });
                    loadBillsList();
                } catch (e) { alert("刪除失敗：" + e.message); }
            }
        }
    </script>
